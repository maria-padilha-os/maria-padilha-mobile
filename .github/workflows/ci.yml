name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scaffold-checks:
    name: scaffold checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run repository checks
        run: tests/all.sh

      - name: Upload build input checksum
        uses: actions/upload-artifact@v4
        with:
          name: build-inputs-checksum
          path: out/build-inputs.sha256
          if-no-files-found: error
