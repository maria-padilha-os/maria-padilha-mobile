# shellcheck shell=bash
# Deferred physical reference target from ADR 0001.
#
# This file records the device choice and build inputs, not support. No image
# is built, flashed or claimed for this device in the current milestone. The
# build script refuses physical targets until the QEMU gate passes and the
# physical checklist exists.

DEVICE="pine64-pinephone"
DEVICE_LABEL="PINE64 PinePhone (deferred physical reference)"
DEVICE_ARCH="aarch64"
DEVICE_KIND="physical"
DEVICE_PHYSICAL="true"

UI="phosh"
INIT_SYSTEM="systemd"
PMB_KERNEL="stable"
PMB_BOOT_SIZE="256"
IMAGE_SIZE="2G"
IMAGE_NAME="maria-padilha-pine64-pinephone.img"

FLASHING="out-of-scope"
