# shellcheck shell=bash
# QEMU ARM64 reference target from ADR 0001.
#
# This is the first-class build target. It exercises the same aarch64 device
# and kernel selection path as the reference phone without requiring hardware.

DEVICE="qemu-aarch64"
DEVICE_LABEL="QEMU aarch64 virtual machine"
DEVICE_ARCH="aarch64"
DEVICE_KIND="virtual"
DEVICE_PHYSICAL="false"

UI="phosh"
INIT_SYSTEM="systemd"
PMB_KERNEL="stable"
PMB_BOOT_SIZE="256"
IMAGE_SIZE="2G"
IMAGE_NAME="maria-padilha-qemu-aarch64.img"

# pmbootstrap's QEMU helper options. Headless by default so CI never needs a
# display server; use QEMU_DISPLAY=gtk for an interactive boot.
QEMU_MACHINE="virt"
QEMU_CPU="max"
QEMU_MEMORY="1024"
QEMU_DISPLAY="none"
