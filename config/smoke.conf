# shellcheck shell=bash
# Pinned inputs and budgets for the unprivileged QEMU serial smoke test.
#
# CI builds a minimal aarch64 initramfs from the pinned Alpine minirootfs and
# boots the pinned Alpine virt kernel. This path deliberately does not use
# pmbootstrap: it needs no sudo/doas, no chroot, no mount and no block device,
# so it can run on a normal hosted runner.
#
# The downloaded files are release artifacts, not floating branches or tags.
# Their SHA-256 values are checked before anything is unpacked or booted.
SMOKE_CONFIG_VERSION="1"
SMOKE_ARCH="aarch64"
SMOKE_ALPINE_RELEASE="3.22.8"

SMOKE_KERNEL_VERSION="6.12.115-0-virt"
SMOKE_KERNEL_URL="https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/aarch64/netboot/vmlinuz-virt"
SMOKE_KERNEL_SHA256="ebf299aa6829b15166008db24b076ac0a8b3e778c72ed66be488742aaf05d741"

SMOKE_ROOTFS_URL="https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/aarch64/alpine-minirootfs-3.22.8-aarch64.tar.gz"
SMOKE_ROOTFS_SHA256="36091efacd083c1cf5a8c837272530bff4fc72db1fbfdef559f52de0d890bca4"

# The guest init prints this exact line on the serial console. Keep the marker
# stable: CI and the local smoke helper both look for it byte-for-byte.
SMOKE_MARKER="MARIA_PADILHA_QEMU_SMOKE_OK"
SMOKE_INIT_CONFIG="config/smoke/init.sh"

SMOKE_KERNEL_NAME="vmlinuz-virt"
SMOKE_INITRAMFS_NAME="maria-padilha-smoke-aarch64.initramfs.gz"
SMOKE_BOOT_LOG="qemu-smoke.log"
SMOKE_MANIFEST="manifest.txt"

# Every path is under this checkout. The cache is safe to restore from CI
# because each file is re-hashed against the pins above before use.
SMOKE_CACHE_DIR="${PADILHA_SMOKE_CACHE_DIR:-$ROOT/.scratch/smoke-cache}"
SMOKE_BUILD_DIR="$ROOT/.scratch/smoke-build"
SMOKE_OUT_DIR="$ROOT/out/smoke"

SMOKE_QEMU_BINARY="qemu-system-aarch64"
SMOKE_QEMU_MACHINE="virt"
SMOKE_QEMU_CPU_TCG="max"
SMOKE_QEMU_CPU_KVM="host"
SMOKE_QEMU_MEMORY="512"
SMOKE_CONSOLE="ttyAMA0"

# Budgets used by CI and by the size checks in the build helper. The boot
# budget is a hard wall-clock timeout, not an aspiration: a guest that does
# not reach the marker is killed and reported as a failure.
SMOKE_DOWNLOAD_BUDGET_MIB="32"
SMOKE_ARTIFACT_BUDGET_MIB="32"
SMOKE_BUILD_TIME_BUDGET="120"
SMOKE_BOOT_TIME_BUDGET="300"
SMOKE_KVM_BOOT_TIME_BUDGET="60"
