# shellcheck shell=bash
# On-screen keyboard configuration for the Maria Padilha Mobile shell.
#
# ADR 0002 selects Squeekboard. This file is sourced by config/build.conf and
# by scripts/install-squeekboard.sh. It contains no user text and no secrets.
#
# Layout files live in config/keyboard/layouts/ and are installed into the
# user's Squeekboard data directory; Squeekboard picks the hint directory from
# the Wayland text-input content purpose (terminal, url, pin) and falls back
# to the default layout for normal text and password fields.

KEYBOARD_BACKEND="squeekboard"
KEYBOARD_PACKAGE="squeekboard"
KEYBOARD_CONFIG="config/keyboard/keyboard.conf"
KEYBOARD_LAYOUT_DIR="config/keyboard/layouts"

# Wayland protocols that carry text and keyboard state. The application side
# (text-input-v3) is provided by Qt Wayland; Squeekboard uses input-method-v2
# and falls back to virtual-keyboard-v1 for legacy clients.
KEYBOARD_TEXT_INPUT_PROTOCOL="zwp_text_input_v3"
KEYBOARD_INPUT_METHOD_PROTOCOL="zwp_input_method_v2"
KEYBOARD_VIRTUAL_KEYBOARD_PROTOCOL="zwp_virtual_keyboard_v1"

# The reference image uses the US keymap (config/build.conf keymap=us), so the
# Padilha layouts override Squeekboard's built-in US files. Other language
# layouts remain upstream.
KEYBOARD_LAYOUT_NAME="us"
KEYBOARD_PRIMARY_LAYOUT="us"
KEYBOARD_WIDE_LAYOUT="us_wide"
KEYBOARD_TERMINAL_LAYOUT="terminal/us"
KEYBOARD_TERMINAL_WIDE_LAYOUT="terminal/us_wide"
KEYBOARD_URL_LAYOUT="url/us"
KEYBOARD_URL_WIDE_LAYOUT="url/us_wide"
KEYBOARD_PIN_LAYOUT="pin/us"
KEYBOARD_PIN_WIDE_LAYOUT="pin/us_wide"
# Wayland content-purpose=password is served by the default layout plus the
# sensitive-data content hint. There is no separate password directory in
# Squeekboard, so this is intentionally the same file as the primary layout.
KEYBOARD_PASSWORD_LAYOUT="us"

# Show/hide policy. Show on text-input focus, hide on blur, surface change or
# lock. The home bar / long-press toggle remains available in Phosh.
KEYBOARD_SHOW_ON_FOCUS="true"
KEYBOARD_HIDE_ON_BLUR="true"
KEYBOARD_AUTO_HIDE="true"
KEYBOARD_HIDE_ON_SURFACE_CHANGE="true"

# Orientation behaviour. Scale 1.0 keeps Squeekboard's proportional layout;
# fit-panel lets it use the wide layout in landscape without clipping.
KEYBOARD_SCALE_PORTRAIT="1.0"
KEYBOARD_SCALE_LANDSCAPE="1.0"
KEYBOARD_FIT_PANEL="true"

# Privacy: no prediction, no spellcheck, no typed-text storage or logging.
# Squeekboard currently has no text-prediction engine; these flags are an
# explicit contract and are checked by tests/keyboard.sh.
KEYBOARD_ENABLE_PREDICTION="false"
KEYBOARD_ENABLE_SPELLCHECK="false"
KEYBOARD_STORE_TYPED_TEXT="false"
KEYBOARD_LOG_TYPED_TEXT="false"

# In-shell fallback: compositor (default), inline, auto or off.
# The inline/auto paths are for development and QEMU fallback checks only.
KEYBOARD_INLINE_FALLBACK="compositor"
