# shellcheck shell=bash
# Maria Padilha Mobile power, thermal and battery policy.
#
# This file is sourced by config/build.conf, scripts/power-*.sh and
# tests/power.sh. Keep it side-effect free and compatible with bash 4+.
#
# The policy has four parts:
#   1. UPower is the source of truth for battery/charging state in Phosh and
#      in the Quickshell prototype.
#   2. Charge thresholds are applied only when the kernel exposes standard
#      power_supply attributes. There is no vendor-specific write and no
#      emulation; unsupported hardware is a documented no-op.
#   3. Thermal readings come from the kernel's thermal/hwmon interface. There
#      is no polling daemon and no fan/CPU policy in this repository.
#   4. Suspend is allowed, while hibernation, hybrid sleep and
#      suspend-then-hibernate are disabled. logind idle handling is left to
#      Phosh so the phone does not suspend twice.
#
# No value here starts a background loop. The charge-threshold service is a
# oneshot, and the sleep hook runs once per suspend/resume cycle.

POWER_CONFIG_VERSION="1"

# Packages added to the image's extra_packages by scripts/build.sh. UPower is
# the battery/charging API; lm-sensors supplies the optional `sensors` reader.
# Neither package is a polling daemon by itself.
POWER_UPOWER_PACKAGE="upower"
POWER_THERMAL_PACKAGE="lm-sensors"
POWER_PACKAGES="$POWER_UPOWER_PACKAGE $POWER_THERMAL_PACKAGE"

# Charge-threshold policy:
#   off               never touch a threshold
#   apply-if-supported write only attributes the kernel exposes
POWER_CHARGE_THRESHOLD_MODE="apply-if-supported"

# Desired window. These are still bounded by what the hardware accepts; the
# helper validates 0..100 and start < end before writing anything.
POWER_CHARGE_THRESHOLD_START="20"
POWER_CHARGE_THRESHOLD_END="80"

# Thermal thresholds used by the diagnostic only. The kernel's critical trip
# points remain authoritative; the image does not install a thermal daemon.
POWER_THERMAL_WARN_C="65"
POWER_THERMAL_CRITICAL_C="80"

# Suspend/resume policy. Phosh/gnome-settings-daemon owns idle suspend, so
# logind's own IdleAction is disabled to avoid a second suspend path.
POWER_SUSPEND_POLICY="phosh-idle-no-hibernate"
POWER_SUSPEND_ALLOW_HIBERNATE="false"
POWER_SUSPEND_ALLOW_HYBRID_SLEEP="false"
POWER_SUSPEND_ALLOW_SUSPEND_THEN_HIBERNATE="false"
POWER_IDLE_ACTION="ignore"

# Installed paths used by the staged configuration. They are also printed by
# scripts/power-diagnostic.sh so a guest and the checkout agree.
POWER_CHARGE_THRESHOLD_HELPER="/usr/libexec/maria-padilha/power-charge-thresholds"
POWER_CHARGE_THRESHOLD_SERVICE="maria-padilha-charge-thresholds.service"
POWER_SLEEP_HOOK_NAME="maria-padilha-power"
POWER_CONFIG_PATH="/etc/maria-padilha/power.conf"

# The diagnostic and all tests are read-only. This is a contract, not a
# runtime toggle: scripts/power-diagnostic.sh never writes sysfs.
POWER_DIAGNOSTIC_READ_ONLY="true"
