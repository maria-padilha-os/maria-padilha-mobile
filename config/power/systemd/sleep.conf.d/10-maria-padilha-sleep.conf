# Maria Padilha Mobile suspend policy.
#
# Suspend is allowed, but the image never exposes hibernation, hybrid sleep or
# suspend-then-hibernate on a phone: those paths need a swap device and are not
# safe on the reference class. Phosh/gnome-settings-daemon owns idle suspend;
# see logind.conf.d/10-maria-padilha-power.conf for the matching idle policy.
#
# This file is staged by scripts/stage-power-config.sh and does not start a
# daemon or a timer.
[Sleep]
AllowSuspend=yes
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
