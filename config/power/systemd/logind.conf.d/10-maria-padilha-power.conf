# Maria Padilha Mobile logind policy.
#
# A phone has no lid and no meaningful hibernate key. The lid settings are
# harmless on phones and protect a future dock/cover accessory from a
# surprise suspend. IdleAction is deliberately ignored: Phosh and
# gnome-settings-daemon own the display/idle policy and would otherwise race a
# second suspend path.
#
# This file is staged by scripts/stage-power-config.sh. It requires a logind
# reload/restart by the image builder; the staging script never invokes the
# service manager.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HandleHibernateKey=ignore
HandleSuspendKey=suspend
IdleAction=ignore
IdleActionSec=30min
