# shellcheck shell=bash
# Flashing and recovery safety policy.
#
# This file is sourced by scripts/flash-check.sh and tests/flashing.sh. It is
# deliberately not sourced by the build path: building an image and writing an
# image are separate operations.
#
# The policy is manual-check-only. No script in this repository flashes,
# partitions, formats, mounts or unmounts anything. The preflight records the
# safety rules so a future change that weakens them is reviewed as a policy
# change, not as an incidental script edit.

FLASHING_CONFIG_VERSION="1"
FLASHING_DOC="docs/flashing.md"
FLASHING_MODE="manual-check-only"
FLASHING_AUTOMATIC="false"

# Images must live in the repository's ignored output directory. That keeps the
# preflight inside the checkout and avoids validating an arbitrary host file.
FLASHING_IMAGE_DIR="$ROOT/out"
FLASHING_MANIFEST_SUFFIX=".sha256"
FLASHING_REQUIRE_CHECKSUM="true"

# Only whole, removable, writable disks with a stable canonical node name are
# accepted. Partitions, loop devices, character devices and host disks are not.
FLASHING_TARGET_PREFIX="/dev/"
FLASHING_ALLOWED_TARGET_REGEX='^/dev/(sd[a-z]+|mmcblk[0-9]+)$'
FLASHING_REQUIRE_BLOCK_DEVICE="true"
FLASHING_REQUIRE_WHOLE_DISK="true"
FLASHING_REQUIRE_REMOVABLE="true"
FLASHING_REFUSE_READ_ONLY="true"
FLASHING_REFUSE_MOUNTED="true"
FLASHING_REFUSE_SWAP="true"
FLASHING_TARGET_MARGIN_MIB="16"

# Per-device matrix. Status values:
#   virtual-only  supported only as a VM; never a flash target
#   bring-up      documented bring-up candidate; not a support claim
#   supported     a reviewed physical target with a passing recovery gate
#   unsupported   explicitly not supported
#
# FLASH_STATUS is machine-readable. The `--strict-support` mode of the
# preflight exits non-zero unless the status is `supported`.
FLASH_STATUS_qemu_aarch64="virtual-only"
FLASH_MEDIA_qemu_aarch64="none"
FLASH_TRANSPORT_qemu_aarch64="none"
FLASH_BOOTLOADER_qemu_aarch64="none"
FLASH_RECOVERY_qemu_aarch64="rebuild the image and boot it again"

FLASH_STATUS_pine64_pinephone="bring-up"
FLASH_MEDIA_pine64_pinephone="microSD"
FLASH_TRANSPORT_pine64_pinephone="removable-block-device"
FLASH_BOOTLOADER_pine64_pinephone="open-foss-u-boot"
FLASH_RECOVERY_pine64_pinephone="boot a known-good SD card or use the upstream eMMC recovery path"
