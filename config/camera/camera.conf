# shellcheck shell=bash
# Maria Padilha Mobile camera and media-capture policy.
#
# This file is sourced by config/build.conf, scripts/build.sh,
# scripts/camera-bridge.py and tests/camera.sh. Keep it side-effect free and
# compatible with bash 4+.
#
# The stack is deliberately boring:
#   libcamera -> PipeWire -> xdg-desktop-portal Camera -> Padilha camera UI.
#
# libcamera owns sensor/ISP enumeration through the kernel media controller.
# PipeWire exposes those camera nodes to the session and carries the buffers.
# xdg-desktop-portal is the permission boundary: the application asks for
# AccessCamera before it may open a PipeWire remote. The Padilha camera surface
# is a thin consumer; it does not probe /dev/video* itself and does not ship a
# vendor camera daemon.
#
# Privacy contract:
#   - no photograph or test image is committed to this repository;
#   - captures go to the per-session runtime directory, never into the image;
#   - the bridge never logs image bytes, frame contents, capture paths or
#     portal request tokens;
#   - nothing is uploaded, indexed or added to a gallery by this milestone;
#   - the no-camera preview is a generated test pattern and is labelled as such.

CAMERA_CONFIG_VERSION="1"

# Chosen stack and the packages that provide it. `pipewire-spa-libcamera` is
# the SPA plugin that publishes libcamera cameras as PipeWire nodes. The GNOME
# portal backend is used because the reference image runs Phosh/GNOME session
# services; `xdg-desktop-portal` itself is backend-independent.
CAMERA_STACK="libcamera-pipewire-portal"
CAMERA_BACKEND="libcamera"
CAMERA_TRANSPORT="PipeWire"
CAMERA_PORTAL="xdg-desktop-portal"

CAMERA_LIBCAMERA_PACKAGE="libcamera"
CAMERA_LIBCAMERA_TOOLS_PACKAGE="libcamera-tools"
CAMERA_PIPEWIRE_PACKAGE="pipewire"
CAMERA_PIPEWIRE_SPA_PACKAGE="pipewire-spa-libcamera"
CAMERA_WIREPLUMBER_PACKAGE="wireplumber"
CAMERA_PORTAL_PACKAGE="xdg-desktop-portal"
CAMERA_PORTAL_BACKEND_PACKAGE="xdg-desktop-portal-gnome"
CAMERA_GSTREAMER_PACKAGES="gstreamer gst-plugins-base gst-plugins-good gst-plugin-pipewire"
CAMERA_PACKAGES="$CAMERA_LIBCAMERA_PACKAGE $CAMERA_LIBCAMERA_TOOLS_PACKAGE $CAMERA_PIPEWIRE_PACKAGE $CAMERA_PIPEWIRE_SPA_PACKAGE $CAMERA_WIREPLUMBER_PACKAGE $CAMERA_PORTAL_PACKAGE $CAMERA_PORTAL_BACKEND_PACKAGE $CAMERA_GSTREAMER_PACKAGES"

# Portal names and interfaces from the published xdg-desktop-portal Camera
# documentation. The bridge uses the session bus, not the system bus.
CAMERA_PORTAL_BUS="session"
CAMERA_PORTAL_NAME="org.freedesktop.portal.Desktop"
CAMERA_PORTAL_PATH="/org/freedesktop/portal/desktop"
CAMERA_PORTAL_INTERFACE="org.freedesktop.portal.Camera"
CAMERA_REQUEST_INTERFACE="org.freedesktop.portal.Request"

# The only camera process the shell starts. It is a short-lived helper, not a
# daemon: state/request/capture each emit one JSON line and exit.
CAMERA_BRIDGE="scripts/camera-bridge.py"

# Permission policy. The UI requests access through the portal and renders a
# denial or cancellation as a normal state, with no retry loop. Direct V4L2
# access is not a fallback because it would bypass the permission boundary.
CAMERA_PERMISSION_MODE="portal"
CAMERA_AUTO_REQUEST="true"
CAMERA_DIRECT_V4L2="false"

# Graceful states. A missing camera or portal is rendered, not treated as a
# shell error. The fallback is a generated pattern, never a stock photograph.
CAMERA_READY_STATE="ready"
CAMERA_NO_CAMERA_STATE="no-camera"
CAMERA_PERMISSION_DENIED_STATE="permission-denied"
CAMERA_PERMISSION_CANCELLED_STATE="permission-cancelled"
CAMERA_PORTAL_UNAVAILABLE_STATE="portal-unavailable"
CAMERA_UNAVAILABLE_STATE="unavailable"
CAMERA_FALLBACK_STATE="test-pattern"
CAMERA_TEST_PATTERN="generated"
CAMERA_TEST_PATTERN_WIDTH="640"
CAMERA_TEST_PATTERN_HEIGHT="480"

# Capture policy. `XDG_RUNTIME_DIR/maria-padilha-camera` is session-private and
# removed by the session; the bridge falls back to a private temporary
# directory if XDG_RUNTIME_DIR is absent. Captures are not persisted by the
# image and are not stored by the shell.
CAMERA_CAPTURE_DIR="maria-padilha-camera"
CAMERA_STORE_CAPTURES="false"
CAMERA_UPLOAD_CAPTURES="false"
CAMERA_LOG_IMAGE_DATA="false"
CAMERA_LOG_CAPTURE_PATHS="false"
CAMERA_BUNDLE_TEST_IMAGES="false"

# Documentation that must move with a policy change.
CAMERA_SUPPORTED_DEVICES_NOTE="docs/camera-supported-devices.md"
CAMERA_QEMU_CHECKLIST="docs/qemu-camera-checklist.md"
