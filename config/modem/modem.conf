# shellcheck shell=bash
# Maria Padilha Mobile cellular modem and telephony policy.
#
# This file is sourced by config/build.conf, scripts/build.sh,
# scripts/telephony-bridge.py and tests/modem.sh. Keep it side-effect free and
# compatible with bash 4+.
#
# The maintained component is ModemManager. The shell does not talk to a modem
# directly: a small bridge consumes ModemManager's documented D-Bus API and
# the Quickshell surfaces render calls and messages. ModemManager owns hardware
# probing, SIM state, voice-call objects and on-modem SMS storage.
#
# Privacy contract:
#   - the shell never writes message text or credentials to disk;
#   - the bridge never logs phone numbers, message text, SIM PIN/PUK or IMSI;
#   - ModemManager must not enable its personal-information logging;
#   - received SMS remain in ModemManager's on-modem storage, not a local cache.

MODEM_CONFIG_VERSION="1"

# Backend and package. `modemmanager` ships the daemon, the D-Bus API and
# `mmcli`; the bridge uses the D-Bus API so message text never appears in a
# process argument list.
MODEM_BACKEND="ModemManager"
MODEM_PACKAGE="modemmanager"
MODEM_PACKAGES="$MODEM_PACKAGE"
MODEM_SERVICE="ModemManager.service"
MODEM_DBUS_NAME="org.freedesktop.ModemManager1"
MODEM_DBUS_PATH="/org/freedesktop/ModemManager1"
MODEM_MIN_VERSION="1.24"
MODEM_VOICE_INTERFACE="org.freedesktop.ModemManager1.Modem.Voice"
MODEM_MESSAGING_INTERFACE="org.freedesktop.ModemManager1.Modem.Messaging"
MODEM_CALL_INTERFACE="org.freedesktop.ModemManager1.Call"
MODEM_SMS_INTERFACE="org.freedesktop.ModemManager1.Sms"

# The bridge is the only telephony process the shell starts. It is a D-Bus
# client, not a second modem daemon.
MODEM_BRIDGE="scripts/telephony-bridge.py"

# Calls are placed through the ModemManager Voice interface. Audio routing and
# emergency-call handling are device/session work and are NOT claimed here.
MODEM_CALLS_ENABLED="true"
MODEM_CALL_AUDIO="device-specific"
MODEM_EMERGENCY_CALLS="false"

# SMS is sent and read through the ModemManager Messaging interface. The shell
# keeps the current list in memory only; ModemManager's storage remains the
# source of truth for messages that the modem keeps.
MODEM_SMS_ENABLED="true"
MODEM_STORE_MESSAGES="false"
MODEM_STORE_CREDENTIALS="false"
MODEM_LOG_MESSAGE_CONTENT="false"
MODEM_LOG_CREDENTIALS="false"
MODEM_LOG_PHONE_NUMBERS="false"

# Graceful states. The UI renders all of these and never treats a missing
# modem or an absent ModemManager daemon as a fatal shell error.
MODEM_NO_MODEM_STATE="no-modem"
MODEM_UNAVAILABLE_STATE="unavailable"
MODEM_LOCKED_STATE="locked"

# Test hook used by tests/modem.sh and the QEMU checklist. The emulated service
# is a ModemManager D-Bus fixture, not a real modem and not a hardware claim.
MODEM_EMULATION="tests/modem/fake_modemmanager.py"
MODEM_TEST_BUS="session"
