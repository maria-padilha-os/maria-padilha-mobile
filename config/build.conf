# shellcheck shell=bash
# Maria Padilha Mobile build configuration.
#
# This file is sourced by scripts/build.sh, scripts/run-qemu.sh and
# tests/build.sh. Keep it side-effect free and compatible with bash 4+.
#
# Base decision: postmarketOS/Nura stable, Phosh, qemu-aarch64 first.
# See ADR 0001 (on the ADR branch) and docs/base-assumption.md.
#
# On-screen keyboard decision: ADR 0002 selects Squeekboard. Its package,
# layout names and privacy flags live in config/keyboard/keyboard.conf.
KEYBOARD_CONFIG="$ROOT/config/keyboard/keyboard.conf"
# shellcheck source=/dev/null
. "$KEYBOARD_CONFIG"

# Battery, charge-threshold, thermal and suspend policy. The image gets the
# packages below; the drop-ins/oneshot service are staged from config/power/.
POWER_CONFIG="$ROOT/config/power/power.conf"
# shellcheck source=/dev/null
. "$POWER_CONFIG"

# Cellular modem and telephony policy. ModemManager is the maintained modem
# stack; config/modem/modem.conf records the package, D-Bus interfaces and the
# no-message/no-credential logging contract.
MODEM_CONFIG="$ROOT/config/modem/modem.conf"
# shellcheck source=/dev/null
. "$MODEM_CONFIG"

# Camera and media-capture policy. libcamera publishes sensors through a
# PipeWire SPA plugin and xdg-desktop-portal is the permission boundary;
# config/camera/camera.conf records the packages and the no-photo contract.
CAMERA_CONFIG="$ROOT/config/camera/camera.conf"
# shellcheck source=/dev/null
. "$CAMERA_CONFIG"

PADILHA_NAME="Maria Padilha Mobile"
PADILHA_RELEASE="v26.06"
PADILHA_CHANNEL="stable"

# The QEMU reference target is the default. A physical phone is never needed
# to validate the build; see devices/qemu-aarch64/device.conf.
DEFAULT_DEVICE="qemu-aarch64"

# Pinned upstream inputs. Branch names are deliberately not used in the build
# path: every checkout is resolved to an exact commit and verified.
PMAPORTS_REPO="https://gitlab.com/postmarketOS/pmaports.git"
# Reproducible pmaports snapshot this scaffold was authored against. The ADR
# selects the v26.06 stable line; that release branch is not published in this
# checkout, so re-pin this commit to the v26.06 release commit before
# publishing an image (see docs/build.md, "Re-pinning").
PMAPORTS_COMMIT="817ed870e92a64963d926354fb74c75090811fcc"

PMBOOTSTRAP_REPO="https://gitlab.com/postmarketOS/pmbootstrap.git"
PMBOOTSTRAP_VERSION="2.3.1"
PMBOOTSTRAP_COMMIT="92524002926401bbe5370e27f36cd2f8a82e2e1a"

# Versioned mirrors only. No floating container images are used in the
# critical path; the toolchain is fetched from the pinned git commits above.
ALPINE_MIRROR="https://dl-cdn.alpinelinux.org/alpine/"
PMOS_MIRROR="https://mirror.postmarketos.org/postmarketos/"

# Every write stays inside this checkout.
BUILD_ROOT="$ROOT/.scratch/build"
PMB_WORK="$BUILD_ROOT/work"
PMB_CONFIG="$BUILD_ROOT/pmbootstrap.cfg"
TOOLCHAIN_DIR="$BUILD_ROOT/toolchain"
OUT_DIR="$ROOT/out"

# pmbootstrap runs as the unprivileged builder user. Its chroot/mount work
# needs sudo/doas on the host; the scaffold's checks never invoke it.
PMB_DUMMY_PASSWORD="147147"
PMB_JOBS="${PMB_JOBS:-$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 2)}"

# QEMU is a validation dependency, not a phone requirement.
QEMU_MIN_VERSION="8.0"
QEMU_BOOT_TIMEOUT="1800"
